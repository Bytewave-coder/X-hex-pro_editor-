[package]
name = "bytewave_rust_validator"
version = "1.5.1"
edition = "2021"
description = "Memory-safe binary container parser and bounds validator for ByteWave Native Disassembler"

[lib]
name = "bytewave_rust_validator"
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
